<!doctype html><html lang="pt-BR"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><link rel="icon" href="/assets/favicon-amevuri-exact.png" /><link rel="stylesheet" href="/styles.css" /><title>Gestão Privé | AMEVURI</title></head><body><main class="admin-orders-page section-pad" data-admin-prive><p class="eyebrow">Configuração privada</p><h1>Gestão<br /><em>Privé.</em></h1><p class="lead">Consulte um membro e registre ajustes auditáveis de pontos ou créditos.</p><form class="admin-search" data-admin-prive-search><label>Chave privada<input type="password" name="key" autocomplete="off" required /></label><label>Email do membro<input type="email" name="email" required /></label><button class="btn btn-primary">Buscar membro</button></form><p class="notice" data-admin-prive-message>Use a mesma AMEVURI_SETUP_KEY configurada no Cloudflare.</p><section class="admin-order-card" data-admin-prive-card hidden><div class="admin-order-head"><div><span class="eyebrow">Membro</span><strong data-admin-prive-name></strong></div><div><span class="eyebrow">Saldo</span><strong data-admin-prive-balance></strong></div></div><form class="admin-update-grid" data-admin-prive-adjust><label>Ajuste de pontos<input name="points" type="number" step="1" value="0" required /></label><label>Ajuste de crédito (R$)<input name="creditAmount" type="number" step="0.01" value="0" required /></label><label>Motivo<input name="reason" maxlength="240" required /></label><button class="btn btn-primary">Registrar ajuste</button></form><div class="admin-order-summary" data-admin-prive-history></div></section></main><script src="/admin-prive.js"></script></body></html>
