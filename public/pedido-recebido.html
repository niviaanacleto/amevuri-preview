<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f3b2f" />
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="icon"
      href="/assets/favicon-amevuri-exact.png"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Pedido recebido | AMEVURI</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html"
        ><img
          class="brand-mark"
          src="/assets/brand-symbol-320.webp"
          alt=""
          width="40"
          height="37"
          decoding="async"
        /><span>AMEVURI</span></a
      >
    </header>
    <div class="page-nav" aria-label="Navegação da página">
      <a class="page-back" href="/index.html" data-smart-back>
        <span aria-hidden="true">←</span><span>Voltar</span>
      </a>
    </div>
    <main class="confirmation-page section-pad" data-order-confirmation>
      <p class="eyebrow">AMEVURI</p>
      <h1>Seu pedido encontrou<br /><em>um lugar na nossa mesa.</em></h1>
      <p class="lead">
        Consulte abaixo a confirmação do pagamento. A preparação começa após a
        aprovação.
      </p>
      <div class="confirmation-card">
        <span>Pedido</span><strong data-order-id>A consultar</strong
        ><span>Status</span><strong data-order-status>Em confirmação</strong>
      </div>
      <div class="hero-actions">
        <a
          class="btn btn-primary"
          href="/acompanhar-pedido"
          data-order-track-link
          >Acompanhar pedido</a
        ><a
          class="btn btn-ghost"
          href="https://wa.me/5521971133616?text=Olá%2C%20gostaria%20de%20falar%20sobre%20meu%20pedido%20AMEVURI."
          target="_blank"
          rel="noopener"
          >Falar conosco</a
        >
      </div>
    </main>
    <script src="/commerce.js"></script>
  </body>
</html>
